<div id="app" class="app"></div>
<script>
const icon=(name)=>{const p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c.5-3 2.5-5 6-5s5.5 2 6 5"/><path d="M16 5a3 3 0 0 1 0 6M18 15c2 .5 3 2 3 5"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.2-6 8-6s7.3 2 8 6"/>',gear:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M3 12h2m14 0h2M12 3v2m0 14v2m-6.4-3.6 1.4-1.4m10-10 1.4-1.4m0 12.8-1.4-1.4m-10-10L5.6 5.6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M19 12H5M11 18l-6-6 6-6"/>',file:'<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 13h6M9 17h6"/>',quiz:'<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>',spark:'<path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',download:'<path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M7 7l1 14h8l1-14M9 7l1-3h4l1 3"/>',edit:'<path d="m4 16-.8 4.8L8 20l11-11-4-4zM13 6l4 4"/>'};return `<svg class="icon" viewBox="0 0 24 24">${p[name]||p.spark}</svg>`};
const data=JSON.parse(localStorage.getItem('edulearn_data')||'{"guru":{"name":"Guru","kelas":""},"siswa":{"name":"Siswa","kelas":""},"materials":[],"quizzes":[],"classes":[],"students":[],"attempts":[]}');
let state={screen:'landing',role:'siswa',history:['landing'],turn:'next',material:null,quiz:null,kelasId:null,toast:'',modal:null,quizIndex:0};
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});async function installEduLearn(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;return}toast('Kalau tombol instal belum muncul, buka menu ⋮ Chrome lalu pilih “Instal EduLearn” atau “Tambahkan ke layar utama”.')}
function saveData(){localStorage.setItem('edulearn_data',JSON.stringify(data))}
function addClass(){state.modal='class';render()}
function addStudent(){const nama=prompt('Nama siswa:');if(!nama)return;const email=prompt('Email siswa (opsional):')||'';data.students.push({id:Date.now(),name:nama,email,kelasId:state.kelasId});saveData();toast('Siswa berhasil ditambahkan')}
function addMaterial(){const judul=prompt('Judul materi:');if(!judul)return;const mapel=prompt('Mata pelajaran:')||'';const kelas=prompt('Kelas:')||'';const summary=prompt('Ringkasan materi:')||'';data.materials.push({id:Date.now(),title:judul,mapel,kelas,guru:data.guru.name||'Guru',summary});saveData();toast('Materi berhasil ditambahkan')}
function addQuiz(){state.modal='quiz';render()}
function closeModal(){state.modal=null;render()}
function submitClass(){const name=document.getElementById('className')?.value.trim();if(!name){alert('Nama kelas wajib diisi');return}const code=document.getElementById('classCode')?.value.trim()||('KLS'+Math.floor(100+Math.random()*900));data.classes.push({id:Date.now(),name,code,description:document.getElementById('classDesc')?.value.trim()||''});saveData();state.modal=null;state.toast='Kelas berhasil ditambahkan';state.screen='kelas';render();setTimeout(()=>{state.toast='';render()},2200)}
function submitQuiz(){const title=document.getElementById('quizTitle')?.value.trim();if(!title){alert('Nama kuis wajib diisi');return}const count=Math.max(1,Number(document.getElementById('quizCount')?.value||10));const time=Math.max(1,Number(document.getElementById('quizTime')?.value||20));const kkm=Math.min(100,Math.max(0,Number(document.getElementById('quizKkm')?.value||75)));data.quizzes.push({id:Date.now(),title,mapel:document.getElementById('quizMapel')?.value.trim()||'',count,time,kkm,questions:[]});saveData();state.modal=null;state.toast='Kuis berhasil dibuat';state.screen='kuis';render();setTimeout(()=>{state.toast='';render()},2200)}
function removeItem(type,id){if(!confirm('Hapus data ini?'))return;if(type==='class')data.classes=data.classes.filter(x=>x.id!==id);if(type==='material')data.materials=data.materials.filter(x=>x.id!==id);if(type==='quiz')data.quizzes=data.quizzes.filter(x=>x.id!==id);if(type==='student')data.students=data.students.filter(x=>x.id!==id);saveData();render()}
function toast(msg){state.toast=msg;render();setTimeout(()=>{state.toast='';render()},2200)}
function go(screen,opts={}){if(state.screen!==screen){state.history.push(screen);state.turn=opts.back?'back':'next';history.pushState({screen},'',`#${screen}`)} Object.assign(state,opts);state.screen=screen;render()}
function back(){if(state.history.length>1){history.back()}else{state.turn='back';go('landing')}}
window.onpopstate=()=>{if(state.history.length>1){state.history.pop();state.screen=state.history[state.history.length-1];state.turn='back';render()}else{state.screen='landing';state.turn='back';render()}};
history.replaceState({screen:'landing'},'',location.pathname+'#landing');
function nav(screen,role=state.role){state.role=role;go(screen)}
function layout(body,title=''){return `<div class="topbar"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn<small>Belajar Lebih Mudah</small></div></div><div class="top-actions"><button class="btn small" onclick="go('notifikasi')">${icon('bell')}</button><div class="avatar">${state.role==='guru'?'BR':'AP'}</div><button class="btn small" onclick="go('profil')">${state.role==='guru'?'Bu Rina':'Andi'}</button></div></div><div class="shell"><aside class="sidebar"><div class="side-label">Menu Utama</div>${navItem('dashboard','home','Dasbor')}${navItem('kelas','book','Kelas')}${navItem('materi','file','Materi')}${navItem('kuis','quiz','Soal / Kuis')}${state.role==='guru'?navItem('siswa','users','Siswa'):''}${navItem('nilai','chart','Nilai')}${navItem('statistik','chart','Statistik')}${navItem('notifikasi','bell','Notifikasi')}${state.role==='guru'?navItem('ai','spark','AI Pembelajaran'):''}<div class="side-label">Akun</div>${navItem('profil','user','Profil')}${navItem('pengaturan','gear','Pengaturan')}<div style="margin-top:20px"><button class="nav" onclick="go('landing')">${icon('back')} Keluar</button></div></aside><main class="main"><div class="content"><div class="page-container"><div class="page-view ${state.turn==='back'?'turn-back':'turn-next'}">${body}</div></div></div></main></div><div class="mobile-menu">${navItemMobile('dashboard','home','Dasbor')}${navItemMobile('materi','file','Materi')}${navItemMobile('kuis','quiz','Kuis')}${navItemMobile('nilai','chart','Nilai')}${navItemMobile('profil','user','Profil')}</div>${state.toast?`<div class="toast">${icon('check')} ${state.toast}</div>`:''}`}
function navItem(s,i,t){return `<button class="nav ${state.screen===s?'active':''}" onclick="nav('${s}')">${icon(i)}<span>${t}</span></button>`}function navItemMobile(s,i,t){return `<button class="${state.screen===s?'active':''}" onclick="nav('${s}')">${icon(i)}<span>${t}</span></button>`}
function landing(){return `<div class="landing"><div class="landing-nav"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn<small>Belajar Lebih Mudah</small></div></div><div class="links"><span>Beranda</span><span>Fitur</span><span>Tentang</span></div><div><button class="btn small" onclick="go('login')">Masuk</button> <button class="btn primary small" onclick="go('register')">Daftar</button></div></div><section class="hero"><div><span class="pill blue">Platform Pembelajaran Online</span><h1>Belajar Lebih Mudah,<br><span>Pahami Materi Lebih Dalam.</span></h1><p>Platform pembelajaran yang membantu guru membagikan materi dan membuat soal, sekaligus membantu siswa memahami pelajaran dengan cara yang lebih terarah.</p><div class="install-card"><div><h3>📱 Jadikan EduLearn sebagai aplikasi</h3><p>Buka dari browser lalu pasang ke layar utama. Tidak perlu Play Store atau App Store.</p></div><button class="btn" onclick="installEduLearn()">Instal EduLearn</button></div><div class="hero-actions"><button class="btn primary" onclick="go('login')">${icon('arrow')} Masuk</button><button class="btn" onclick="go('register')">Daftar</button></div><div class="muted">✓ Materi terstruktur &nbsp; ✓ Kuis interaktif &nbsp; ✓ Perkembangan belajar</div></div><div class="hero-visual"><div class="illustration"><div class="person"></div><div class="laptop"></div><div class="book"></div><div class="desk"></div></div></div></section><div class="feature-row"><div class="feature">${icon('book')}<strong>Materi Lengkap</strong><span>PDF, gambar, dan teks pembelajaran tersusun rapi.</span></div><div class="feature">${icon('quiz')}<strong>Soal Interaktif</strong><span>Kuis dengan pembahasan dan penilaian otomatis.</span></div><div class="feature">${icon('chart')}<strong>Nilai Tersimpan</strong><span>Lihat perkembangan belajar dari waktu ke waktu.</span></div><div class="feature">${icon('spark')}<strong>AI Pembelajaran</strong><span>Bantu membuat ringkasan dan soal dengan cepat.</span></div></div></div>`}
function login(){return `<div class="auth-wrap"><div class="auth-side"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn</div></div><h1>Belajar lebih terarah bersama EduLearn.</h1><p>Masuk untuk melanjutkan pembelajaran, membaca materi, mengerjakan kuis, atau mengelola kelas.</p></div><div class="auth-card"><div class="card"><button class="btn small" onclick="back()">${icon('back')} Kembali</button><div style="text-align:center;margin:18px 0"><div class="logo-mark" style="margin:auto">${icon('spark')}</div><h2 style="font-size:20px;margin:10px 0 4px">Masuk ke akun Anda</h2><span class="muted">Selamat datang kembali!</span></div><div class="role-switch"><button class="${state.role==='guru'?'active':''}" onclick="state.role='guru';render()">${icon('user')} Guru</button><button class="${state.role==='siswa'?'active':''}" onclick="state.role='siswa';render()">${icon('users')} Siswa</button></div><div class="field" style="margin-bottom:12px"><label>Email atau Nama Pengguna</label><input id="loginUser" placeholder="Masukkan email atau nama pengguna"></div><div class="field"><label>Kata Sandi</label><input type="password" placeholder="Masukkan kata sandi"></div><div style="display:flex;justify-content:space-between;margin:12px 0;font-size:10px;color:#7d899e"><label><input type="checkbox"> Ingat saya</label><span style="color:var(--biru);font-weight:700">Lupa kata sandi?</span></div><button class="btn primary" style="width:100%" onclick="toast('Berhasil masuk');setTimeout(()=>go('dashboard'),250)">Masuk</button><div style="text-align:center;margin-top:16px;font-size:10px;color:#7c879a">Belum punya akun? <b style="color:var(--biru);cursor:pointer" onclick="go('register')">Daftar sekarang</b></div></div></div></div>`}
function register(){return `<div class="auth-wrap"><div class="auth-side"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn</div></div><h1>Mulai perjalanan belajar Anda.</h1><p>Buat akun sebagai guru untuk mengelola kelas, atau sebagai siswa untuk mengikuti materi dan kuis.</p></div><div class="auth-card"><div class="card"><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin:18px 0 5px">Daftar sebagai ${state.role==='guru'?'Guru':'Siswa'}</h2><span class="muted">Lengkapi data untuk membuat akun.</span><div class="role-switch"><button class="${state.role==='guru'?'active':''}" onclick="state.role='guru';render()">Guru</button><button class="${state.role==='siswa'?'active':''}" onclick="state.role='siswa';render()">Siswa</button></div><div class="form-grid"><div class="field"><label>Nama Lengkap</label><input placeholder="Masukkan nama lengkap"></div><div class="field"><label>Email</label><input placeholder="Masukkan email"></div><div class="field"><label>Kata Sandi</label><input type="password" placeholder="Buat kata sandi yang kuat"></div>${state.role==='guru'?'<div class="field"><label>Nama Sekolah / Institusi</label><input placeholder="Masukkan nama sekolah"></div><div class="field"><label>Kode Guru (opsional)</label><input placeholder="Masukkan kode guru"></div>':'<div class="field"><label>Kelas</label><select><option>X IPA 1</option><option>X IPA 2</option><option>XI IPA 1</option></select></div><div class="field"><label>Kode Kelas (dari guru)</label><input placeholder="Masukkan kode kelas"></div>'}</div><button class="btn primary" style="width:100%;margin-top:17px" onclick="toast('Pendaftaran berhasil');setTimeout(()=>go('dashboard'),250)">Daftar</button><div style="text-align:center;margin-top:15px;font-size:10px;color:#7c879a">Sudah punya akun? <b style="color:var(--biru);cursor:pointer" onclick="go('login')">Masuk</b></div></div></div></div>`}
function dashboard(){return layout(state.role==='guru'?dashboardGuru():dashboardSiswa())}
function dashboardGuru(){return `<div class="page-head"><div><h2>Selamat datang, Bu Rina!</h2><div class="muted">Semoga hari ini menjadi hari yang produktif.</div></div><button class="btn primary" onclick="go('ai')">${icon('spark')} Buat dengan AI</button></div><div class="grid stats">${stat('users','Jumlah Siswa','32','+2 hari ini')}${stat('file','Jumlah Materi','12','+1 minggu ini')}${stat('quiz','Jumlah Kuis','8','+2 minggu ini')}${stat('chart','Rata-rata Nilai','82','+5% dari bulan lalu')}</div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title"><h3>Perkembangan Nilai Siswa</h3><select class="btn small"><option>6 bulan terakhir</option><option>3 bulan terakhir</option></select></div><div class="chart">${[25,42,35,58,67,82].map(v=>`<div class="bar" style="height:${v*1.7}px" data-v="${v}"></div>`).join('')}</div><div class="axis">${['Mei','Jun','Jul','Agu','Sep','Okt'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="card"><div class="section-title"><h3>Aktivitas Terbaru</h3><span class="muted">Hari ini</span></div>${activity('book','Materi baru ditambahkan','Biologi · Sistem Pencernaan','2 jam lalu')}${activity('quiz','Siswa mengerjakan kuis','Matematika · Persamaan Linear','3 jam lalu')}${activity('chart','Nilai terbaru','Andi · 90 · Fotosintesis','5 jam lalu')}${activity('users','Kelas baru dibuat','X IPA 1','1 hari lalu')}</div></div><div class="grid three" style="margin-top:18px"><quick title="Kelas Aktif" value="3" action="Lihat Kelas" onclick="go('kelas')"/><quick title="Materi Menunggu" value="2" action="Kelola Materi" onclick="go('materi')"/><quick title="Soal Tersimpan" value="46" action="Buka Bank Soal" onclick="go('kuis')"/></div>`}
function stat(ic,title,num,delta){return `<div class="card stat"><div><span>${title}</span><strong>${num}</strong><div class="delta">${delta}</div></div><div class="ico">${icon(ic)}</div></div>`}function activity(ic,t,p,time){return `<div class="activity"><div class="dot">${icon(ic)}</div><div><b>${t}</b><p>${p}</p></div><span class="muted" style="margin-left:auto;white-space:nowrap">${time}</span></div>`}function quick({title,value,action,onclick}){return `<div class="card"><div class="muted">${title}</div><strong style="font-size:28px">${value}</strong><div style="margin-top:12px"><button class="btn soft small" onclick="${onclick}">${action} ${icon('arrow')}</button></div></div>`}
function dashboardSiswa(){return `<div class="page-head"><div><h2>Selamat datang, Andi!</h2><div class="muted">Yuk lanjutkan belajar hari ini.</div></div><button class="btn primary" onclick="go('materi')">${icon('book')} Lanjut Belajar</button></div><div class="grid two"><div class="card"><div class="section-title"><h3>Progress Belajar</h3><span class="pill green">Aktif</span></div><div style="display:flex;align-items:center;gap:20px"><div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--biru) 0 70%,#edf1f7 70% 100%);display:grid;place-items:center"><div style="width:82px;height:82px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:22px">70%</div></div><div><strong style="font-size:18px">3 dari 5 materi</strong><p class="muted">telah selesai dipelajari</p><button class="btn soft small" onclick="go('materi')">Lihat Materi</button></div></div></div><div class="card"><div class="section-title"><h3>Nilai Terbaru</h3><span class="muted">Minggu ini</span></div><div style="font-size:40px;font-weight:900;color:var(--hijau)">85</div><span class="pill green">Lulus</span><p class="muted">Kuis Sistem Pencernaan · 2 hari lalu</p></div></div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title"><h3>Materi Terbaru</h3><a onclick="go('materi')">Lihat semua</a></div>${data.materials.slice(0,2).map(materialMini).join('')}</div><div class="card"><div class="section-title"><h3>Kuis Tersedia</h3><a onclick="go('kuis')">Lihat semua</a></div>${data.quizzes.slice(0,2).map(quizMini).join('')}</div></div>`}
function materialMini(m){return `<div class="activity" onclick="go('detailMateri',{material:${m.id}})" style="cursor:pointer"><div class="dot">${icon('file')}</div><div><b>${m.title}</b><p>${m.mapel} · ${m.kelas}</p></div><span class="pill blue" style="margin-left:auto">Baca</span></div>`}function quizMini(q){return `<div class="activity"><div class="dot">${icon('quiz')}</div><div><b>${q.title}</b><p>${q.count} soal · ${q.time} menit · KKM ${q.kkm}</p></div><button class="btn primary small" style="margin-left:auto" onclick="go('kerjakanKuis',{quiz:q.id})">Mulai</button></div>`}
function kelas(){return layout(`<div class="page-head"><div><h2>Daftar Kelas</h2><div class="muted">Semua kelas dimulai kosong dan bisa kamu isi sendiri.</div></div>${state.role==='guru'?'<button type="button" class="btn primary" id="btnTambahKelas">'+icon('plus')+' Buat Kelas</button>':''}</div><div class="grid three">${(data.classes||[]).map(k=>`<div class="card"><div style="display:flex;justify-content:space-between"><div class="material-icon">${icon('users')}</div><button type="button" class="btn danger small" onclick="removeItem('class',${k.id})">${icon('trash')}</button></div><h3 style="font-size:15px;margin:14px 0 5px">${k.name}</h3><div class="muted">Kode: ${k.code}</div><p class="muted">${(data.students||[]).filter(s=>s.kelasId===k.id).length} siswa</p><button type="button" class="btn soft small" onclick="go('detailKelas',{kelasId:${k.id}})">Lihat Detail ${icon('arrow')}</button></div>`).join('')||'<div class="card" style="grid-column:1/-1;text-align:center;padding:45px"><div class="material-icon" style="margin:auto">'+icon('users')+'</div><h3>Belum ada kelas</h3><p class="muted">Klik “Buat Kelas” untuk menambahkan kelas pertama.</p></div>'}</div>`)}
function detailKelas(){const k=(data.classes||[]).find(x=>x.id===state.kelasId);if(!k){return layout('<div class="card"><h3>Kelas tidak ditemukan</h3><button class="btn" onclick="back()">Kembali</button></div>')}const ss=(data.students||[]).filter(s=>s.kelasId===k.id);return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">${k.name}</h2><div class="muted">Kode kelas: ${k.code} · ${ss.length} siswa</div></div><button class="btn primary" onclick="addStudent()">${icon('plus')} Tambah Siswa</button></div><div class="card table-wrap"><div class="section-title"><h3>Daftar Siswa (${ss.length})</h3></div><table class="table"><thead><tr><th>No</th><th>Nama Siswa</th><th>Email</th><th></th></tr></thead><tbody>${ss.map((s,i)=>`<tr><td>${i+1}</td><td><b>${s.name}</b></td><td>${s.email||'-'}</td><td><button class="btn danger small" onclick="removeItem('student',${s.id})">${icon('trash')}</button></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:#7c879a">Belum ada siswa di kelas ini.</td></tr>'}</tbody></table></div>`)}
function materi(){return layout(`<div class="page-head"><div><h2>${state.role==='guru'?'Materi Pembelajaran':'Materi Belajar'}</h2><div class="muted">Materi kamu tersimpan di browser ini dan bisa dikelola kapan saja.</div></div>${state.role==='guru'?'<button class="btn primary" onclick="go(\'upload\')">'+icon('plus')+' Tambah Materi</button>':''}</div><div class="grid">${data.materials.map(m=>`<div class="card material-card"><div class="material-icon">${icon('file')}</div><div><span class="pill blue">${m.mapel||'Tanpa mapel'}</span><h4>${m.title}</h4><p>${m.kelas||'Tanpa kelas'} · ${m.guru||'Guru'}</p><p style="margin-top:6px"><b>Ringkasan:</b> ${m.summary||'Belum ada ringkasan.'}</p></div><div class="material-actions">${state.role==='guru'?'<button class="btn danger small" onclick="removeItem(\'material\','+m.id+')">'+icon('trash')+'</button>':''}<button class="btn primary small" onclick="go('detailMateri',{material:${m.id}})">Baca Materi</button></div></div>`).join('')||'<div class="card" style="text-align:center;padding:45px"><div class="material-icon" style="margin:auto">'+icon('file')+'</div><h3>Belum ada materi</h3><p class="muted">Tambahkan materi pertama untuk mulai mengisi EduLearn.</p></div>'}</div>`)}
function detailMateri(){let m=data.materials.find(x=>x.id===state.material)||data.materials[0];return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">${m.title}</h2><div class="muted">${m.mapel} · ${m.kelas} · ${m.guru}</div></div><button class="btn primary" onclick="go('kerjakanKuis',{quiz:1})">${icon('quiz')} Mulai Kuis</button></div><div class="tabs"><button class="tab active">Materi</button><button class="tab">Penjelasan</button><button class="tab">Ringkasan</button><button class="tab">Poin Penting</button><button class="tab">Contoh</button><button class="tab">Istilah Penting</button></div><div class="card reading"><h3>RINGKASAN MATERI</h3><div class="callout"><p style="margin:0">${m.summary}</p></div><h3>Penjelasan</h3><p>Materi ini menjelaskan konsep utama dengan bahasa sederhana agar siswa dapat memahami hubungan antarbagian dan menerapkannya dalam kehidupan sehari-hari. Bacalah setiap bagian secara bertahap, lalu gunakan contoh untuk memperkuat pemahaman.</p><h3>Poin Penting</h3><ul class="list-check"><li>Kenali konsep dan istilah utama.</li><li>Pahami proses atau langkah yang dijelaskan.</li><li>Hubungkan materi dengan contoh sehari-hari.</li><li>Gunakan kuis untuk mengecek pemahaman.</li></ul><h3>Contoh</h3><div class="callout"><b>Contoh penerapan:</b><p>Perhatikan bagaimana konsep pada materi ini dapat ditemukan di lingkungan sekitar. Setelah itu, jelaskan kembali dengan kalimatmu sendiri.</p></div></div>`)}
function upload(){return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">Tambah Materi Baru</h2><div class="muted">Isi data materi. Ringkasan bisa kamu masukkan sekarang dan diedit lagi nanti.</div></div></div><div class="card"><div class="form-grid"><div class="field"><label>Judul Materi</label><input id="mJudul" placeholder="Masukkan judul materi"></div><div class="field"><label>Mata Pelajaran</label><input id="mMapel" placeholder="Masukkan mata pelajaran"></div><div class="field"><label>Kelas</label><input id="mKelas" placeholder="Masukkan kelas"></div><div class="field"><label>Deskripsi / Ringkasan</label><input id="mSummary" placeholder="Masukkan ringkasan"></div><div class="field full"><label>Unggah File</label><div class="drop" onclick="document.getElementById('fileInput').click()">${icon('file')}<b id="fileName">Pilih PDF atau gambar</b><span>PDF, JPG, JPEG, PNG</span><input id="fileInput" type="file" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="document.getElementById('fileName').textContent=this.files[0]?.name||'Pilih PDF atau gambar'"></div></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:17px"><button class="btn" onclick="back()">Batal</button><button class="btn primary" onclick="const t=document.getElementById('mJudul').value.trim();if(!t){alert('Judul materi wajib diisi');return}data.materials.push({id:Date.now(),title:t,mapel:document.getElementById('mMapel').value.trim(),kelas:document.getElementById('mKelas').value.trim(),guru:data.guru.name||'Guru',summary:document.getElementById('mSummary').value.trim()});saveData();go('materi')">Simpan Materi</button></div></div>`)}
function ai(){return layout(`<div class="page-head"><div><h2>AI Pembelajaran</h2><div class="muted">Buat materi, ringkasan, dan soal dengan bantuan AI.</div></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Buat Materi dengan AI</h3><span class="pill blue">AI</span></div><div class="form-grid"><div class="field"><label>Judul Materi</label><input placeholder="Contoh: Sistem Pernapasan Manusia"></div><div class="field"><label>Mata Pelajaran</label><select><option>Biologi</option><option>Matematika</option></select></div><div class="field"><label>Kelas</label><select><option>VIII</option><option>X IPA 1</option></select></div><div class="field full"><label>Prompt / Instruksi Tambahan</label><textarea placeholder="Buat materi tentang sistem pernapasan manusia untuk siswa kelas 8. Gunakan bahasa sederhana dan berikan contoh sehari-hari."></textarea></div></div><button class="btn primary" onclick="go('aiHasil')">${icon('spark')} Buat dengan AI</button></div><div class="card"><div class="section-title"><h3>Generator Soal</h3><span class="pill orange">Otomatis</span></div><div class="field" style="margin-bottom:12px"><label>Prompt</label><textarea placeholder="Buat 10 soal tentang fotosintesis untuk kelas 10 dengan tingkat kesulitan sedang."></textarea></div><div class="form-grid"><div class="field"><label>Jumlah Soal</label><input value="10"></div><div class="field"><label>Tingkat Kesulitan</label><select><option>Sedang</option><option>Mudah</option><option>Sulit</option></select></div><div class="field"><label>Tipe Soal</label><select><option>Pilihan Ganda</option><option>Benar / Salah</option><option>Isian Singkat</option><option>Uraian</option></select></div><div class="field"><label>KKM</label><input value="75"></div></div><button class="btn primary" style="margin-top:13px" onclick="go('aiSoal')">${icon('spark')} Buat Soal</button></div></div>`)}
function aiHasil(){return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">Periksa Hasil AI</h2><div class="muted">Ubah hasil sebelum disimpan sebagai materi.</div></div><div><button class="btn" onclick="toast('Bagian berhasil ditambahkan')">${icon('plus')} Tambah Bagian</button> <button class="btn primary" onclick="toast('Materi dan kuis berhasil disimpan')">Simpan Materi + Buat Kuis</button></div></div><div class="grid two"><div class="card"><div class="field"><label>Judul</label><input value="Sistem Pernapasan Manusia"></div><div class="field" style="margin-top:12px"><label>Penjelasan</label><textarea>Proses pernapasan membantu tubuh mengambil oksigen dan mengeluarkan karbon dioksida. Udara masuk melalui hidung, melewati saluran pernapasan, lalu pertukaran gas terjadi di alveolus.</textarea></div><div class="field" style="margin-top:12px"><label>Ringkasan</label><textarea>Organ pernapasan bekerja bersama untuk memasukkan oksigen ke tubuh dan mengeluarkan karbon dioksida.</textarea></div></div><div class="card"><h3 style="font-size:14px">Poin Penting</h3><ul class="list-check"><li>Hidung menyaring dan menghangatkan udara.</li><li>Trakea menyalurkan udara ke paru-paru.</li><li>Alveolus menjadi tempat pertukaran gas.</li></ul><h3 style="font-size:14px;margin-top:22px">Contoh</h3><p class="muted">Saat berlari, kebutuhan oksigen meningkat sehingga frekuensi pernapasan menjadi lebih cepat.</p><h3 style="font-size:14px;margin-top:22px">Istilah Penting</h3><div><span class="pill blue">Alveolus</span> <span class="pill blue">Oksigen</span> <span class="pill blue">Karbon dioksida</span></div></div></div>`)}
function aiSoal(){return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">Hasil Generator Soal</h2><div class="muted">Tinjau dan ubah soal sebelum diterbitkan.</div></div><button class="btn primary" onclick="toast('Soal berhasil disimpan')">Simpan Soal</button></div><div class="card">${[1,2,3].map((n)=>`<div style="padding:16px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">${n}. Apa fungsi utama paru-paru dalam proses pernapasan?</b><button class="btn small">${icon('edit')} Ubah</button></div><div class="muted" style="margin-top:8px">A. Mencerna makanan &nbsp; B. Pertukaran gas &nbsp; C. Memompa darah &nbsp; D. Menyaring darah</div><p style="font-size:10px;color:var(--hijau);font-weight:800">Jawaban benar: B · Pertukaran gas di alveolus.</p></div>`).join('')}<div style="padding-top:14px;text-align:center"><button class="btn soft" onclick="toast('3 soal tambahan dibuat')">${icon('spark')} Buat Soal Tambahan</button></div></div>`)}
function kuis(){return layout(`<div class="page-head"><div><h2>Soal / Kuis</h2><div class="muted">Buat kuis dan kelola soal yang kamu masukkan sendiri.</div></div>${state.role==='guru'?'<button type="button" class="btn primary" id="btnTambahKuis">'+icon('plus')+' Buat Kuis</button>':''}</div><div class="grid">${data.quizzes.map(q=>`<div class="card material-card"><div class="material-icon">${icon('quiz')}</div><div><span class="pill blue">${q.mapel||'Tanpa mapel'}</span><h4>${q.title}</h4><p>${q.count} pertanyaan · ${q.time} menit · KKM ${q.kkm}</p></div><div class="material-actions">${state.role==='guru'?'<button type="button" class="btn danger small" onclick="removeItem(\'quiz\','+q.id+')">'+icon('trash')+'</button>':''}<button type="button" class="btn primary small" onclick="go('kerjakanKuis',{quiz:${q.id}})">Mulai Kuis</button></div></div>`).join('')||'<div class="card" style="text-align:center;padding:45px"><div class="material-icon" style="margin:auto">'+icon('quiz')+'</div><h3>Belum ada kuis</h3><p class="muted">Klik “Buat Kuis” untuk menambahkan kuis pertama.</p></div>'}</div>`)}
function kerjakanKuis(){let q=data.quizzes.find(x=>x.id===state.quiz)||data.quizzes[0];return layout(`<div class="page-head"><div><h2>${q.title}</h2><div class="muted">${q.mapel} · ${q.count} pertanyaan</div></div><div class="timer">${icon('clock')} 00:18:24</div></div><div class="card"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:8px"><span>Soal ${state.quizIndex+1} dari ${q.count}</span><span>18% selesai</span></div><div class="progress"><i style="width:${((state.quizIndex+1)/q.count)*100}%"></i></div><div class="quiz-q">Bentuk yang tepat untuk menjelaskan proses tumbuhan menghasilkan makanan dengan bantuan cahaya adalah...</div>${['Fotosintesis','Respirasi','Transpirasi','Fermentasi'].map((x,i)=>`<label class="option"><input type="radio" name="opsi"> <span>${String.fromCharCode(65+i)}. ${x}</span></label>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:22px"><button class="btn" onclick="state.quizIndex=Math.max(0,state.quizIndex-1);render()" ${state.quizIndex===0?'disabled':''}>${icon('back')} Sebelumnya</button><button class="btn primary" onclick="${state.quizIndex>=q.count-1?'go(\'hasilKuis\')':'state.quizIndex++;render()'}">${state.quizIndex>=q.count-1?'Kumpulkan':'Selanjutnya'} ${icon('arrow')}</button></div></div>`)}
function hasilKuis(){return layout(`<div class="card result"><div class="trophy">${icon('quiz')}</div><h2>Kuis Selesai!</h2><p class="muted">Berikut adalah hasil pengerjaan kuismu.</p><div class="score">85 <span style="font-size:20px;color:#8792a7">/ 100</span></div><span class="pill green">Lulus</span><div class="result-grid"><div><b>17</b><span>Benar</span></div><div><b>3</b><span>Salah</span></div><div><b>18:24</b><span>Waktu Pengerjaan</span></div></div><button class="btn primary" onclick="toast('Pembahasan dibuka')">Lihat Pembahasan</button> <button class="btn" onclick="go('detailMateri',{material:1})">Kembali ke Materi</button></div>`)}
function nilai(){return layout(`<div class="page-head"><div><h2>Riwayat Nilai</h2><div class="muted">Pantau hasil kuis dan perkembangan nilai.</div></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Kuis / Ujian</th><th>Mata Pelajaran</th><th>Tanggal</th><th>Nilai</th><th>Status</th></tr></thead><tbody>${[['Sistem Pencernaan','Biologi','12 Apr 2025','85','Lulus'],['Persamaan Linear','Matematika','10 Apr 2025','78','Lulus'],['Fotosintesis','Biologi','5 Apr 2025','73','Tidak Lulus'],['Teks Deskripsi','Bahasa Indonesia','2 Apr 2025','88','Lulus']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}</b></td><td><span class="pill ${r[4]==='Lulus'?'green':'red'}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div>`)}
function statistik(){return layout(`<div class="page-head"><div><h2>Statistik & Perkembangan</h2><div class="muted">Ringkasan performa belajar dan nilai siswa.</div></div></div><div class="grid stats">${stat('chart','Rata-rata Nilai','82','+5%')}${stat('check','Kehadiran','94%','+2%')}${stat('quiz','Kuis Selesai','18','+4')}${stat('book','Materi Selesai','70%','3 dari 5')}</div><div class="card" style="margin-top:18px"><div class="section-title"><h3>Rata-rata Nilai per Mata Pelajaran</h3><select class="btn small"><option>Semua Mata Pelajaran</option></select></div><div class="chart">${[75,82,88,79,91,85].map(v=>`<div class="bar" style="height:${v*1.5}px" data-v="${v}"></div>`).join('')}</div><div class="axis">${['Matematika','Biologi','IPA','B. Indonesia','Bahasa','Seni'].map(x=>`<span>${x}</span>`).join('')}</div></div>`)}
function notifikasi(){return layout(`<div class="page-head"><div><h2>Notifikasi</h2><div class="muted">Informasi terbaru seputar pembelajaran.</div></div><button class="btn small" onclick="toast('Semua notifikasi ditandai sudah dibaca')">Tandai semua dibaca</button></div><div class="card">${activity('book','Materi baru ditambahkan','Sistem Pencernaan Manusia · Biologi','2 jam lalu')}${activity('quiz','Kuis baru tersedia','Persamaan Linear · Matematika','3 jam lalu')}${activity('chart','Nilai terbaru','Kuis Fotosintesis · Nilai 85','5 jam lalu')}${activity('bell','Pengingat kuis','Kuis akan ditutup besok pukul 20.00','1 hari lalu')}</div>`)}
function profil(){return layout(`<div class="page-head"><div><h2>Profil</h2><div class="muted">Kelola informasi akun Anda.</div></div><button class="btn primary" onclick="toast('Perubahan profil disimpan')">Simpan Perubahan</button></div><div class="card"><div style="display:flex;gap:18px;align-items:center;margin-bottom:20px"><div class="avatar" style="width:68px;height:68px;font-size:18px">${state.role==='guru'?'BR':'AP'}</div><div><h3 style="margin:0">${state.role==='guru'?'Bu Rina':'Andi Pratama'}</h3><p class="muted">${state.role==='guru'?'Guru · Sekolah EduLearn':'Siswa · X IPA 1'}</p></div></div><div class="form-grid"><div class="field"><label>Nama Lengkap</label><input value="${state.role==='guru'?'Bu Rina':'Andi Pratama'}"></div><div class="field"><label>Email</label><input value="akun@edulearn.id"></div><div class="field"><label>Nama Pengguna</label><input value="${state.role==='guru'?'burina':'andipratama'}"></div><div class="field"><label>${state.role==='guru'?'Sekolah / Institusi':'Kelas'}</label><input value="${state.role==='guru'?'Sekolah EduLearn':'X IPA 1'}"></div></div></div>`)}
function pengaturan(){return layout(`<div class="page-head"><div><h2>Pengaturan</h2><div class="muted">Atur keamanan dan preferensi akun.</div></div></div><div class="grid two"><div class="card"><h3 style="font-size:14px">Keamanan</h3>${['Ubah Kata Sandi','Verifikasi Dua Langkah','Perangkat yang Masuk'].map(x=>`<div class="activity"><div><b>${x}</b><p>Kelola pengaturan keamanan akun.</p></div><button class="btn small" onclick="toast('${x} dibuka')">Atur ${icon('arrow')}</button></div>`).join('')}</div><div class="card"><h3 style="font-size:14px">Preferensi</h3>${['Notifikasi Pembelajaran','Pengingat Kuis','Ringkasan Mingguan'].map(x=>`<div class="activity"><div><b>${x}</b><p>Aktifkan atau nonaktifkan pemberitahuan.</p></div><input type="checkbox" checked style="accent-color:var(--biru);margin-left:auto;width:18px;height:18px"></div>`).join('')}</div></div>`)}
function siswa(){return layout(`<div class="page-head"><div><h2>Daftar Siswa</h2><div class="muted">Siswa yang kamu tambahkan akan tampil di sini.</div></div>${state.role==='guru'&&data.classes?.length?'<button class="btn primary" onclick="state.kelasId=data.classes[0].id;addStudent()">'+icon('plus')+' Tambah Siswa</button>':''}</div><div class="card table-wrap"><table class="table"><thead><tr><th>Nama Siswa</th><th>Email</th><th>Kelas</th><th></th></tr></thead><tbody>${(data.students||[]).map(s=>`<tr><td><b>${s.name}</b></td><td>${s.email||'-'}</td><td>${(data.classes||[]).find(k=>k.id===s.kelasId)?.name||'-'}</td><td><button class="btn danger small" onclick="removeItem('student',${s.id})">${icon('trash')}</button></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:35px;color:#7c879a">Belum ada siswa.</td></tr>'}</tbody></table></div>`)}
function modal(){if(!state.modal)return '';if(state.modal==='class')return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="page-head"><div><h2>Tambah Kelas</h2><div class="muted">Isi data kelas yang ingin kamu kelola.</div></div><button type="button" class="btn small" onclick="closeModal()">Tutup</button></div><div class="form-grid"><div class="field"><label>Nama Kelas</label><input id="className" placeholder="Contoh: X IPA 1" autofocus></div><div class="field"><label>Kode Kelas</label><input id="classCode" placeholder="Contoh: IPA101"></div><div class="field full"><label>Deskripsi (opsional)</label><textarea id="classDesc" placeholder="Deskripsi singkat kelas"></textarea></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button type="button" class="btn primary" onclick="submitClass()">${icon('check')} Simpan Kelas</button></div></div></div>`;return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="page-head"><div><h2>Buat Kuis</h2><div class="muted">Isi pengaturan kuis sebelum menambahkan soal.</div></div><button type="button" class="btn small" onclick="closeModal()">Tutup</button></div><div class="form-grid"><div class="field"><label>Nama Kuis</label><input id="quizTitle" placeholder="Contoh: Kuis Bab 1" autofocus></div><div class="field"><label>Mata Pelajaran</label><input id="quizMapel" placeholder="Masukkan mata pelajaran"></div><div class="field"><label>Jumlah Soal</label><input id="quizCount" type="number" min="1" value="10"></div><div class="field"><label>Waktu (menit)</label><input id="quizTime" type="number" min="1" value="20"></div><div class="field"><label>KKM</label><input id="quizKkm" type="number" min="0" max="100" value="75"></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Batal</button><button type="button" class="btn primary" onclick="submitQuiz()">${icon('check')} Simpan Kuis</button></div></div></div>`}
function render(){let html='';if(state.screen==='landing')html=landing();else if(state.screen==='login')html=login();else if(state.screen==='register')html=register();else if(state.screen==='dashboard')html=dashboard();else if(state.screen==='kelas')html=kelas();else if(state.screen==='detailKelas')html=detailKelas();else if(state.screen==='materi')html=materi();else if(state.screen==='detailMateri')html=detailMateri();else if(state.screen==='upload')html=upload();else if(state.screen==='ai')html=ai();else if(state.screen==='aiHasil')html=aiHasil();else if(state.screen==='aiSoal')html=aiSoal();else if(state.screen==='kuis')html=kuis();else if(state.screen==='kerjakanKuis')html=kerjakanKuis();else if(state.screen==='hasilKuis')html=hasilKuis();else if(state.screen==='nilai')html=nilai();else if(state.screen==='statistik')html=statistik();else if(state.screen==='notifikasi')html=notifikasi();else if(state.screen==='profil')html=profil();else if(state.screen==='pengaturan')html=pengaturan();else if(state.screen==='siswa')html=siswa();document.getElementById('app').innerHTML=html+modal();const tambah=document.getElementById('btnTambahKelas');if(tambah)tambah.onclick=addClass;const kuisBtn=document.getElementById('btnTambahKuis');if(kuisBtn)kuisBtn.onclick=addQuiz;window.scrollTo({top:0,behavior:'instant'})}
if ("serviceWorker" in navigator) { window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
render();
</script>
</body></html>
