.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#f7f9ff}.auth-side{padding:55px 8%;background:#eef3ff;display:flex;flex-direction:column;justify-content:center}.auth-side h1{font-size:42px;color:#183879;line-height:1.12}.auth-side p{color:var(--sub);line-height:1.7}.auth-card{width:min(460px,90%);margin:auto}.auth-card .card{padding:30px}.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#f2f5fa;padding:5px;border-radius:10px;margin:20px 0}.role-switch button{border:0;background:transparent;padding:9px;border-radius:7px;font-size:11px;font-weight:800;color:#7c879a}.role-switch button.active{background:#fff;color:var(--biru);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.mobile-menu{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#17223b;color:#fff;border-radius:10px;padding:12px 16px;font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:100}.modal-back{position:fixed;inset:0;background:rgba(20,33,60,.25);display:grid;place-items:center;z-index:80}.modal{width:min(650px,92vw);max-height:85vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px rgba(19,34,70,.22)}

@media(max-width:760px){.topbar{padding:0 15px}.sidebar{display:none}.shell{min-height:calc(100vh - 64px)}.topbar{height:64px}.mobile-menu{display:flex;position:fixed;bottom:12px;left:12px;right:12px;height:58px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 30px rgba(20,40,90,.12);z-index:50;justify-content:space-around;align-items:center}.mobile-menu button{border:0;background:none;color:#78849a;font-size:9px;font-weight:800;display:flex;flex-direction:column;gap:3px;align-items:center}.mobile-menu button.active{color:var(--biru)}.content{padding:20px 14px 90px}.stats,.two,.three,.form-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.page-container{min-height:650px}.page-view{min-height:650px}.hero{padding:35px 6% 25px}.hero h1{font-size:34px}.landing-nav .links{display:none}.feature-row{padding:0 6% 35px;grid-template-columns:1fr}.auth-wrap{grid-template-columns:1fr}.auth-side{display:none}.auth-card{padding:20px 0}.table-wrap{overflow:auto}.table{min-width:650px}.material-card{flex-wrap:wrap}.material-actions{width:100%;margin-left:55px}.hero-visual{min-height:240px}.illustration{height:220px}.desk{bottom:35px}.person{bottom:50px;transform:scale(.8)}.laptop{bottom:65px;right:35px;transform:scale(.8)}.book{bottom:67px;left:35px;transform:scale(.8) rotate(-8deg)}}
@media(prefers-reduced-motion:reduce){.page-view.turn-next,.page-view.turn-back{animation:none}.btn{transition:none}}

<body>
<div id="app" class="app"></div>
<script>const icon=(name)=>{const p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v15"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c.5-3 2.5-5 6-5s5.5 2 6 5"/><path d="M16 5a3 3 0 0 1 0 6M18 15c2 .5 3 2 3 5"/>',chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 3-4 3 2 5-7"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.2-6 8-6s7.3 2 8 6"/>',gear:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M3 12h2m14 0h2M12 3v2m0 14v2m-6.4-3.6 1.4-1.4m10-10 1.4-1.4m0 12.8-1.4-1.4m-10-10L5.6 5.6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M19 12H5M11 18l-6-6 6-6"/>',file:'<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 13h6M9 17h6"/>',quiz:'<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>',spark:'<path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M7 7l1 14h8l1-14M9 7l1-3h4l1 3"/>',edit:'<path d="m4 16-.8 4.8L8 20l11-11-4-4zM13 6l4 4"/>'};return `<svg class="icon" viewBox="0 0 24 24">${p[name]||p.spark}</svg>`};
const defaultData={version:3,accounts:[],activeUserId:null,otp:null,materials:[],quizzes:[],classes:[],students:[],attempts:[]};
let data;try{data=JSON.parse(localStorage.getItem('edulearn_data')||'null')}catch(e){data=null}if(!data||data.version!==3){data=defaultData;localStorage.setItem('edulearn_data',JSON.stringify(data))}
let state={screen:'landing',role:'siswa',history:['landing'],turn:'next',material:null,quiz:null,quizIndex:0,answers:{},modal:null,aiDraft:null,toast:''};
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
async function installEduLearn(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}else alert('Buka menu browser lalu pilih Instal EduLearn / Tambahkan ke layar utama.')}
function saveData(){localStorage.setItem('edulearn_data',JSON.stringify(data))}
function account(){return data.accounts.find(a=>a.id===data.activeUserId)||null}
function firstName(n){return String(n||'Pengguna').trim().split(/\s+/)[0]||'Pengguna'}
function initials(n){return firstName(n).slice(0,2).toUpperCase()}
function toast(m){state.toast=m;render();setTimeout(()=>{state.toast='';render()},1800)}
function go(screen,opts={}){if(state.screen!==screen){state.history.push(screen);history.pushState({screen},'',`#${screen}`)}Object.assign(state,opts);state.screen=screen;state.turn=opts.back?'back':'next';render()}
function back(){if(state.history.length>1)history.back();else go('landing',{back:true})}
window.onpopstate=()=>{if(state.history.length>1){state.history.pop();state.screen=state.history[state.history.length-1];state.turn='back';render()}else{state.screen='landing';state.history=['landing'];render()}}
history.replaceState({screen:'landing'},'',location.pathname+'#landing');
function nav(s){if(!account()){go('login');return}go(s)}
function navItem(s,i,t){return `<button class="nav ${state.screen===s?'active':''}" onclick="nav('${s}')">${icon(i)}<span>${t}</span></button>`}
function navMobile(s,i,t){return `<button class="${state.screen===s?'active':''}" onclick="nav('${s}')">${icon(i)}<span>${t}</span></button>`}
function layout(body){const a=account();return `<div class="topbar"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn<small>Belajar Lebih Mudah</small></div></div><div class="top-actions"><button class="btn small" onclick="nav('notifikasi')">${icon('bell')}</button><div class="avatar">${initials(a?.name)}</div><button class="btn small" onclick="nav('profil')">${firstName(a?.name)}</button></div></div><div class="shell"><aside class="sidebar"><div class="side-label">Menu Utama</div>${navItem('dashboard','home','Dasbor')}${navItem('kelas','book','Kelas')}${navItem('materi','file','Materi')}${navItem('kuis','quiz','Soal / Kuis')}${a?.role==='guru'?navItem('siswa','users','Siswa'):''}${navItem('nilai','chart','Nilai')}${navItem('statistik','chart','Statistik')}${navItem('notifikasi','bell','Notifikasi')}<div class="side-label">Akun</div>${navItem('profil','user','Profil')}${navItem('pengaturan','gear','Pengaturan')}<div style="margin-top:20px"><button class="nav" onclick="logout()">${icon('back')}<span>Keluar</span></button></div></aside><main class="main"><div class="content"><div class="page-container"><div class="page-view ${state.turn==='back'?'turn-back':'turn-next'}">${body}</div></div></div></main></div><div class="mobile-menu">${navMobile('dashboard','home','Dasbor')}${navMobile('materi','file','Materi')}${navMobile('kuis','quiz','Kuis')}${navMobile('nilai','chart','Nilai')}${navMobile('profil','user','Profil')}</div>${state.toast?`<div class="toast">${icon('check')} ${state.toast}</div>`:''}`}
function landing(){return `<div class="landing"><div class="landing-nav"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn<small>Belajar Lebih Mudah</small></div></div><div class="links"><span>Beranda</span><span>Fitur</span><span>Tentang</span></div><div><button class="btn small" onclick="go('login')">Masuk</button> <button class="btn primary small" onclick="go('register')">Daftar</button></div></div><section class="hero"><div><span class="pill blue">Platform Pembelajaran Online</span><h1>Belajar Lebih Mudah,<br><span>Pahami Materi Lebih Dalam.</span></h1><p>Platform pembelajaran untuk guru dan siswa: materi, soal harian, ujian, dan nilai dalam satu tempat.</p><div class="install-card"><div><h3>📱 Jadikan EduLearn sebagai aplikasi</h3><p>Buka dari browser lalu pasang ke layar utama. Tidak perlu Play Store.</p></div><button class="btn" onclick="installEduLearn()">Instal EduLearn</button></div><div class="hero-actions"><button class="btn primary" onclick="go('login')">${icon('arrow')} Masuk</button><button class="btn" onclick="go('register')">Daftar</button></div></div><div class="hero-visual"><div class="illustration"><div class="person"></div><div class="laptop"></div><div class="book"></div><div class="desk"></div></div></div></section></div>`}
function login(){return `<div class="auth-wrap"><div class="auth-side"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn</div></div><h1>Masuk ke EduLearn.</h1><p>Gunakan email dan kata sandi akun yang sudah diverifikasi.</p></div><div class="auth-card"><div class="card"><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin:18px 0 5px">Masuk</h2><span class="muted">Pilih peran akun lalu masuk.</span><div class="role-switch"><button class="${state.role==='guru'?'active':''}" onclick="state.role='guru';render()">${icon('user')} Guru</button><button class="${state.role==='siswa'?'active':''}" onclick="state.role='siswa';render()">${icon('users')} Siswa</button></div><div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="nama@email.com"></div><div class="field" style="margin-top:12px"><label>Kata Sandi</label><input id="loginPassword" type="password" placeholder="Kata sandi"></div><button class="btn primary" style="width:100%;margin-top:17px" onclick="doLogin()">Masuk</button><div style="text-align:center;margin-top:15px;font-size:10px;color:#7c879a">Belum punya akun? <b style="color:var(--biru);cursor:pointer" onclick="go('register')">Daftar</b></div></div></div></div>`}
function register(){return `<div class="auth-wrap"><div class="auth-side"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn</div></div><h1>Buat akun EduLearn.</h1><p>Nama depan akun akan otomatis dipakai di pojok kanan dan halaman profil.</p></div><div class="auth-card"><div class="card"><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin:18px 0 5px">Daftar</h2><span class="muted">Email akan melalui langkah verifikasi OTP.</span><div class="role-switch"><button class="${state.role==='guru'?'active':''}" onclick="state.role='guru';render()">Guru</button><button class="${state.role==='siswa'?'active':''}" onclick="state.role='siswa';render()">Siswa</button></div><div class="form-grid"><div class="field"><label>Nama Lengkap</label><input id="regName" placeholder="Nama lengkap"></div><div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="nama@email.com"></div><div class="field"><label>Kata Sandi</label><input id="regPassword" type="password" placeholder="Minimal 6 karakter"></div><div class="field"><label>Kelas</label><input id="regClass" placeholder="Contoh: X IPA 1"></div></div><button class="btn primary" style="width:100%;margin-top:17px" onclick="startRegister()">Daftar & Verifikasi</button><div style="margin-top:12px;padding:11px;border-radius:10px;background:#fff8e8;border:1px solid #ffe1a6;font-size:10px;color:#7b632c">Untuk OTP yang benar-benar terkirim ke email, versi produksi perlu layanan autentikasi/email server. Di versi APK ini alurnya sudah tersedia untuk pengujian.</div></div></div></div>`}
function startRegister(){const name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim().toLowerCase(),password=document.getElementById('regPassword').value,kelas=document.getElementById('regClass').value.trim();if(!name||!email||!password||!kelas)return alert('Nama, email, kata sandi, dan kelas wajib diisi.');if(password.length<6)return alert('Kata sandi minimal 6 karakter.');if(data.accounts.some(a=>a.email===email))return alert('Email sudah terdaftar.');data.otp={name,email,password,kelas,role:state.role,code:String(Math.floor(100000+Math.random()*900000))};saveData();go('verifyOtp')}
function verifyOtp(){const o=data.otp;return `<div class="auth-wrap"><div class="auth-side"><div class="brand"><div class="logo-mark">${icon('spark')}</div><div>EduLearn</div></div><h1>Verifikasi email.</h1><p>Masukkan kode OTP 6 digit.</p></div><div class="auth-card"><div class="card"><h2>Verifikasi OTP</h2><p class="muted">Akun: ${o?.email||'-'}</p><div class="field" style="margin-top:18px"><label>Kode OTP</label><input id="otpCode" inputmode="numeric" maxlength="6" placeholder="000000"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="finishRegister()">Verifikasi & Buat Akun</button>${o?`<div style="margin-top:14px;padding:13px;border:1px dashed #cbd7ff;border-radius:10px;background:#f7f9ff;font-size:11px"><b>Mode pengujian APK:</b> kode OTP saat ini <strong>${o.code}</strong>. Ini akan diganti OTP email sungguhan setelah backend email dipasang.</div>`:''}</div></div></div>`}
function finishRegister(){const o=data.otp;if(!o)return;const code=document.getElementById('otpCode').value.trim();if(code!==o.code)return alert('Kode OTP salah.');const id='usr_'+Date.now();data.accounts.push({id,name:o.name,email:o.email,password:o.password,kelas:o.kelas,role:o.role,verified:true});data.activeUserId=id;data.otp=null;saveData();state.role=o.role;state.history=['landing','dashboard'];state.screen='dashboard';render()}
function doLogin(){const email=document.getElementById('loginEmail').value.trim().toLowerCase(),password=document.getElementById('loginPassword').value,a=data.accounts.find(x=>x.email===email&&x.password===password&&x.role===state.role);if(!a)return alert('Email, kata sandi, atau peran tidak sesuai.');if(!a.verified)return alert('Akun belum diverifikasi.');data.activeUserId=a.id;saveData();state.history=['landing','dashboard'];state.screen='dashboard';render()}
function logout(){data.activeUserId=null;saveData();state.history=['landing'];state.screen='landing';state.role='siswa';render()}
function cardStat(title,value){return `<div class="card"><div class="muted">${title}</div><div style="font-size:27px;font-weight:900;margin-top:7px">${value}</div></div>`}
function dashboard(){const a=account();const myAttempts=data.attempts.filter(x=>x.studentId===a?.id);return layout(`<div class="page-head"><div><h2>Dasbor</h2><div class="muted">Selamat datang, ${firstName(a?.name)}.</div></div></div><div class="grid stats">${cardStat('Materi',data.materials.length)}${cardStat('Soal / Kuis',data.quizzes.length)}${cardStat(a?.role==='guru'?'Siswa':'Kuis Dikerjakan',a?.role==='guru'?data.students.length:myAttempts.length)}${cardStat('Nilai',a?.role==='guru'?data.attempts.length:(myAttempts.length?Math.round(myAttempts.reduce((s,x)=>s+x.score,0)/myAttempts.length):0))}</div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title"><h3>Materi Terbaru</h3><button class="btn small" onclick="nav('materi')">Buka Materi</button></div>${data.materials.slice(-3).reverse().map(m=>`<div class="activity"><div><b>${m.title}</b><p>${m.mapel||'Tanpa mapel'} · ${m.kelas||'-'}</p></div></div>`).join('')||'<p class="muted">Belum ada materi.</p>'}</div><div class="card"><div class="section-title"><h3>${a?.role==='guru'?'Pengerjaan Terbaru':'Kuis Tersedia'}</h3><button class="btn small" onclick="nav('${a?.role==='guru'?'nilai':'kuis'}')">Buka</button></div><p class="muted">${a?.role==='guru'?(data.attempts.length?'Sudah ada pengerjaan siswa.':'Belum ada siswa yang mengerjakan.'):(data.quizzes.length?'Ada kuis yang bisa dikerjakan.':'Belum ada kuis.')}</p></div></div>`)}
function kelas(){return layout(`<div class="page-head"><div><h2>Kelas</h2><div class="muted">Kelola kelas yang kamu ajar atau ikuti.</div></div>${account()?.role==='guru'?'<button class="btn primary" onclick="state.modal=\'class\';render()">'+icon('plus')+' Tambah Kelas</button>':''}</div><div class="grid">${data.classes.map(c=>`<div class="card"><span class="pill blue">${c.code}</span><h3>${c.name}</h3><p class="muted">${c.description||'Tidak ada deskripsi.'}</p></div>`).join('')||'<div class="card" style="text-align:center;padding:45px"><h3>Belum ada kelas</h3><p class="muted">Guru bisa menambahkan kelas dari tombol di atas.</p></div>'}</div>`)}
function submitClass(){const name=document.getElementById('className').value.trim();if(!name)return alert('Nama kelas wajib diisi.');data.classes.push({id:Date.now(),name,code:document.getElementById('classCode').value.trim()||('KLS'+Math.floor(100+Math.random()*900)),description:document.getElementById('classDesc').value.trim()});saveData();state.modal=null;render()}
function materi(){return layout(`<div class="page-head"><div><h2>Materi Pembelajaran</h2><div class="muted">Guru dapat membuat materi manual atau membantu proses ringkasan dengan AI.</div></div>${account()?.role==='guru'?'<button class="btn primary" onclick="go(\'upload\')">'+icon('plus')+' Tambah Materi</button>':''}</div>${account()?.role==='guru'?`<div class="card" style="margin-bottom:18px"><div class="section-title"><div><h3>Buat / Ringkas dengan AI</h3><p class="muted">Masukkan teks atau unggah file sebagai bahan. Hasil tetap bisa diedit.</p></div><span class="pill blue">AI</span></div><textarea id="aiText" placeholder="Tempel isi materi di sini..."></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><label class="btn"><input id="aiFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.txt" style="display:none" onchange="document.getElementById('aiFileName').textContent=this.files[0]?.name||''">${icon('file')} Upload File</label><span id="aiFileName" class="muted" style="padding:9px 0"></span><button class="btn primary" onclick="makeAiMaterial()">${icon('spark')} Ringkas dengan AI</button></div></div>`:''}<div class="grid">${data.materials.map(m=>`<div class="card material-card"><div class="material-icon">${icon('file')}</div><div><span class="pill blue">${m.mapel||'Tanpa mapel'}</span><h4>${m.title}</h4><p>${m.kelas||'-'} · ${m.guru||'-'}</p><p style="margin-top:6px"><b>Ringkasan:</b> ${m.summary||'Belum ada ringkasan.'}</p></div><div class="material-actions">${account()?.role==='guru'?'<button class="btn danger small" onclick="deleteMaterial('+m.id+')">'+icon('trash')+'</button>':''}<button class="btn primary small" onclick="go('detailMateri',{material:${m.id}})">Baca</button></div></div>`).join('')||'<div class="card" style="text-align:center;padding:45px"><h3>Belum ada materi</h3><p class="muted">Belum ada materi yang dibuat.</p></div>'}</div>`)}
function makeAiMaterial(){const text=document.getElementById('aiText').value.trim(),file=document.getElementById('aiFile').files[0];if(!text&&!file)return alert('Masukkan teks atau unggah file.');const base=text||`Sumber file: ${file.name}. Isi file PDF/gambar membutuhkan OCR/AI server pada versi produksi.`;const clean=base.replace(/\s+/g,' ').trim();const summary=clean.length>500?clean.slice(0,500)+'…':clean;state.aiDraft={title:(file?.name||'Materi Baru').replace(/\.[^.]+$/,''),mapel:'',kelas:account()?.kelas||'',content:text,summary,fileName:file?.name||''};go('aiHasil')}
function upload(){return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">Tambah Materi Manual</h2></div></div><div class="card"><div class="form-grid"><div class="field"><label>Judul Materi</label><input id="mTitle"></div><div class="field"><label>Mata Pelajaran</label><input id="mMapel"></div><div class="field"><label>Kelas</label><input id="mClass" value="${account()?.kelas||''}"></div><div class="field full"><label>Isi Materi</label><textarea id="mContent" style="min-height:180px" placeholder="Tulis materi di sini..."></textarea></div><div class="field full"><label>Ringkasan</label><textarea id="mSummary"></textarea></div><div class="field full"><label>File (opsional)</label><input id="mFile" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div><div style="text-align:right;margin-top:16px"><button class="btn primary" onclick="saveMaterial()">${icon('check')} Simpan Materi</button></div></div>`)}
function saveMaterial(){const title=document.getElementById('mTitle').value.trim();if(!title)return alert('Judul materi wajib diisi.');data.materials.push({id:Date.now(),title,mapel:document.getElementById('mMapel').value.trim(),kelas:document.getElementById('mClass').value.trim(),content:document.getElementById('mContent').value.trim(),summary:document.getElementById('mSummary').value.trim(),guru:account()?.name||'',fileName:document.getElementById('mFile').files[0]?.name||''});saveData();go('materi')}
function aiHasil(){const d=state.aiDraft||{};return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">Edit Hasil AI</h2><div class="muted">Guru tetap punya kendali penuh dan bisa mengubah isi.</div></div></div><div class="card"><div class="form-grid"><div class="field"><label>Judul</label><input id="dTitle" value="${d.title||''}"></div><div class="field"><label>Mata Pelajaran</label><input id="dMapel" value="${d.mapel||''}"></div><div class="field"><label>Kelas</label><input id="dClass" value="${d.kelas||''}"></div><div class="field full"><label>Isi / Penjelasan</label><textarea id="dContent" style="min-height:190px">${d.content||''}</textarea></div><div class="field full"><label>Ringkasan</label><textarea id="dSummary">${d.summary||''}</textarea></div></div><div style="text-align:right;margin-top:16px"><button class="btn primary" onclick="saveAiMaterial()">${icon('check')} Simpan ke Materi</button></div></div>`)}
function saveAiMaterial(){data.materials.push({id:Date.now(),title:document.getElementById('dTitle').value.trim()||'Materi Baru',mapel:document.getElementById('dMapel').value.trim(),kelas:document.getElementById('dClass').value.trim(),content:document.getElementById('dContent').value.trim(),summary:document.getElementById('dSummary').value.trim(),guru:account()?.name||'',fileName:state.aiDraft?.fileName||''});saveData();state.aiDraft=null;go('materi')}
function detailMateri(){const m=data.materials.find(x=>x.id===state.material)||data.materials[0];if(!m)return layout('<div class="card"><h3>Belum ada materi.</h3></div>');return layout(`<div class="page-head"><div><button class="btn small" onclick="back()">${icon('back')} Kembali</button><h2 style="margin-top:12px">${m.title}</h2><div class="muted">${m.mapel||'-'} · ${m.kelas||'-'}</div></div></div><div class="card reading"><h3>Materi</h3><p>${m.content||'Belum ada isi materi.'}</p><h3>Penjelasan</h3><p>${m.content||'Belum ada penjelasan.'}</p><h3>Ringkasan</h3><p>${m.summary||'Belum ada ringkasan.'}</p><h3>Poin Penting</h3><p>${m.summary||'Belum ada poin penting.'}</p><h3>Contoh</h3><p>Guru dapat menambahkan contoh langsung ke isi materi.</p><h3>Istilah Penting</h3><p class="muted">Belum ada istilah yang ditambahkan.</p></div>`)}
function deleteMaterial(id){if(confirm('Hapus materi ini?')){data.materials=data.materials.filter(m=>m.id!==id);saveData();render()}}
function kuis(){return layout(`<div class="page-head"><div><h2>Soal / Kuis</h2><div class="muted">Pisahkan soal Harian dan Ujian. Soal bisa dibuat manual dari materi atau dibantu AI.</div></div>${account()?.role==='guru'?'<button class="btn primary" onclick="state.modal=\'quiz\';render()">'+icon('plus')+' Buat Soal / Kuis</button>':''}</div>${account()?.role==='guru'?`<div class="card" style="margin-bottom:18px"><h3>Buat dari Materi</h3><p class="muted">Pilih materi lalu pilih pembuatan manual atau bantuan AI.</p><div class="form-grid"><div class="field"><label>Materi</label><select id="sourceMaterial"><option value="">Pilih materi</option>${data.materials.map(m=>`<option value="${m.id}">${m.title}</option>`).join('')}</select></div><div class="field"><label>Metode</label><select id="sourceMethod"><option value="manual">Manual</option><option value="ai">Bantuan AI</option></select></div></div><div style="margin-top:12px"><button class="btn primary" onclick="createQuizFromMaterial()">${icon('plus')} Buat dari Materi</button></div></div>`:''}<div class="grid">${data.quizzes.map(q=>`<div class="card material-card"><div class="material-icon">${icon('quiz')}</div><div><span class="pill ${q.type==='Ujian'?'orange':'blue'}">${q.type}</span><h4>${q.title}</h4><p>${q.mapel||'-'} · ${q.questions.length} soal · ${q.time} menit · KKM ${q.kkm}</p></div><div class="material-actions">${account()?.role==='guru'?'<button class="btn danger small" onclick="deleteQuiz('+q.id+')">'+icon('trash')+'</button>':''}<button class="btn primary small" onclick="openQuiz(${q.id})">${account()?.role==='guru'?'Kelola':'Mulai'}</button></div></div>`).join('')||'<div class="card" style="text-align:center;padding:45px"><h3>Belum ada soal / kuis</h3><p class="muted">Data masih kosong.</p></div>'}</div>`)}
function createQuizFromMaterial(){const m=data.materials.find(x=>x.id===Number(document.getElementById('sourceMaterial').value));if(!m)return alert('Pilih materi.');const method=document.getElementById('sourceMethod').value;const q={id:Date.now(),title:(method==='ai'?'AI - ':'')+'Kuis '+m.title,mapel:m.mapel||'',type:'Harian',time:20,kkm:75,materialId:m.id,questions:[]};if(method==='ai'){const s=(m.content||m.summary||'').split(/(?<=[.!?])\s+/).filter(x=>x.length>15).slice(0,5);s.forEach((x,i)=>q.questions.push({text:`Menurut materi ${m.title}, pernyataan yang sesuai adalah?`,options:[x,'Pernyataan yang tidak dibahas','Tidak ada hubungan','Semua salah'],answer:x}))}data.quizzes.push(q);saveData();state.quiz=q.id;state.screen='kelolaQuiz';render()}
function openQuiz(id){state.quiz=id;state.quizIndex=0;state.answers={};state.screen=account()?.role==='guru'?'kelolaQuiz':'kerjakanKuis';render()}
function deleteQuiz(id){if(confirm('Hapus kuis ini?')){data.quizzes=data.quizzes.filter(q=>q.id!==id);saveData();render()}}
function kelolaQuiz(){const q=data.quizzes.find(x=>x.id===state.quiz);if(!q)return layout('<div class="card">Kuis tidak ditemukan.</div>');return layout(`<div class="page-head"><div><button class="btn small" onclick="go('kuis')">${icon('back')} Kembali</button><h2 style="margin-top:12px">${q.title}</h2><div class="muted">${q.type} · ${q.mapel||'-'}</div></div><button class="btn primary" onclick="state.modal='question';render()">${icon('plus')} Tambah Soal</button></div><div class="card">${q.questions.map((x,i)=>`<div class="activity"><div><b>${i+1}. ${x.text}</b><p>Jawaban: ${x.answer}</p></div><button class="btn danger small" onclick="removeQuestion(${i})">${icon('trash')}</button></div>`).join('')||'<div style="text-align:center;padding:35px"><h3>Belum ada soal</h3><p class="muted">Tambahkan soal manual.</p></div>'}</div>`)}
function removeQuestion(i){const q=data.quizzes.find(x=>x.id===state.quiz);if(q&&confirm('Hapus soal?')){q.questions.splice(i,1);saveData();render()}}
function kerjakanKuis(){const q=data.quizzes.find(x=>x.id===state.quiz);if(!q||!q.questions.length)return layout('<div class="card" style="text-align:center;padding:45px"><h3>Soal belum tersedia</h3><p class="muted">Guru belum menambahkan soal.</p><button class="btn" onclick="go(\'kuis\')">Kembali</button></div>');const x=q.questions[state.quizIndex];return layout(`<div class="page-head"><div><h2>${q.title}</h2><div class="muted">${q.type} · Soal ${state.quizIndex+1}/${q.questions.length}</div></div></div><div class="card"><div class="progress"><i style="width:${((state.quizIndex+1)/q.questions.length)*100}%"></i></div><div class="quiz-q">${x.text}</div>${x.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${String(o).replace(/"/g,'&quot;')}" ${state.answers[state.quizIndex]===o?'checked':''}> <span>${String.fromCharCode(65+i)}. ${o}</span></label>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:22px"><button class="btn" onclick="recordAnswer();state.quizIndex--;render()" ${state.quizIndex===0?'disabled':''}>${icon('back')} Sebelumnya</button><button class="btn primary" onclick="recordAnswer();${state.quizIndex===q.questions.length-1?'finishQuiz()':'state.quizIndex++;render()'}">${state.quizIndex===q.questions.length-1?'Kumpulkan':'Selanjutnya'} ${icon('arrow')}</button></div></div>`)}
function recordAnswer(){const e=document.querySelector('input[name="ans"]:checked');if(e)state.answers[state.quizIndex]=e.value}
function finishQuiz(){const q=data.quizzes.find(x=>x.id===state.quiz),a=account();let correct=0;q.questions.forEach((x,i)=>{if(String(state.answers[i]||'').trim().toLowerCase()===String(x.answer||'').trim().toLowerCase())correct++});const score=Math.round(correct/q.questions.length*100);const attempt={id:Date.now(),studentId:a.id,studentName:a.name,quizId:q.id,quizTitle:q.title,score,kkm:q.kkm,correct,total:q.questions.length};data.attempts.push(attempt);saveData();state.quizResult=attempt;go('hasilKuis')}
function hasilKuis(){const a=state.quizResult;return layout(`<div class="card result"><div class="trophy">${icon('quiz')}</div><h2>Kuis Selesai</h2><div class="score">${a?.score||0} <span style="font-size:20px;color:#8792a7">/ 100</span></div><span class="pill ${a?.score>=a?.kkm?'green':'red'}">${a?.score>=a?.kkm?'Lulus':'Belum Lulus'}</span><div class="result-grid"><div><b>${a?.correct||0}</b><span>Benar</span></div><div><b>${(a?.total||0)-(a?.correct||0)}</b><span>Salah</span></div><div><b>${a?.kkm||75}</b><span>KKM</span></div></div><button class="btn primary" onclick="go('nilai')">Lihat Nilai</button></div>`)}
function nilai(){const a=account();const rows=data.attempts.filter(x=>a.role==='guru'||x.studentId===a.id);return layout(`<div class="page-head"><div><h2>Nilai</h2><div class="muted">Nilai muncul setelah siswa mengerjakan soal/kuis.</div></div></div>${rows.length?`<div class="card table-wrap"><table class="table"><thead><tr><th>Siswa</th><th>Soal / Ujian</th><th>Tanggal</th><th>Nilai</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.studentName}</td><td>${x.quizTitle}</td><td>${new Date(x.id).toLocaleDateString('id-ID')}</td><td><b>${x.score}</b></td><td><span class="pill ${x.score>=x.kkm?'green':'red'}">${x.score>=x.kkm?'Lulus':'Belum Lulus'}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="card" style="text-align:center;padding:55px"><h3>Belum ada nilai</h3><p class="muted">Nilai masih kosong sampai ada siswa yang mengerjakan soal di tab Soal / Kuis.</p></div>'}`)}
function statistik(){return layout(`<div class="page-head"><div><h2>Statistik</h2><div class="muted">Data statistik mengikuti data nyata yang tersimpan.</div></div></div><div class="grid stats">${cardStat('Materi',data.materials.length)}${cardStat('Kuis',data.quizzes.length)}${cardStat('Pengerjaan',data.attempts.length)}${cardStat('Siswa',data.students.length)}</div>`)}
function siswa(){return layout(`<div class="page-head"><div><h2>Siswa</h2><div class="muted">Daftar siswa yang dikelola guru.</div></div></div><div class="card">${data.students.length?data.students.map(s=>`<div class="activity"><div><b>${s.name}</b><p>${s.email||'-'} · ${s.kelas||'-'}</p></div></div>`).join(''):'<p class="muted">Belum ada siswa.</p>'}</div>`)}
function notifikasi(){return layout(`<div class="page-head"><div><h2>Notifikasi</h2><div class="muted">Notifikasi akan mengikuti aktivitas akun.</div></div></div><div class="card"><p class="muted">Belum ada notifikasi.</p></div>`)}
function profil(){const a=account();return layout(`<div class="page-head"><div><h2>Profil</h2><div class="muted">Data ini sama dengan data saat akun pertama dibuat.</div></div></div><div class="card"><div style="display:flex;gap:18px;align-items:center;margin-bottom:20px"><div class="avatar" style="width:68px;height:68px;font-size:18px">${initials(a.name)}</div><div><h3 style="margin:0">${a.name}</h3><p class="muted">${a.role==='guru'?'Guru':'Siswa'} · ${a.kelas}</p></div></div><div class="form-grid"><div class="field"><label>Nama Lengkap</label><input id="pName" value="${a.name}"></div><div class="field"><label>Email</label><input value="${a.email}" disabled></div><div class="field"><label>Kelas</label><input id="pClass" value="${a.kelas}"></div><div class="field"><label>Peran</label><input value="${a.role==='guru'?'Guru':'Siswa'}" disabled></div></div><button class="btn primary" style="margin-top:16px" onclick="saveProfile()">${icon('check')} Simpan</button></div>`)}
function saveProfile(){const a=account(),name=document.getElementById('pName').value.trim(),kelas=document.getElementById('pClass').value.trim();if(!name)return alert('Nama wajib diisi.');a.name=name;a.kelas=kelas;saveData();render()}
function pengaturan(){return layout(`<div class="page-head"><div><h2>Pengaturan</h2><div class="muted">Pengaturan akun.</div></div></div><div class="card"><p class="muted">Pengaturan keamanan akan tersedia setelah layanan autentikasi server dipasang.</p></div>`)}
function modal(){if(!state.modal)return '';if(state.modal==='class')return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Tambah Kelas</h2><div class="field"><label>Nama Kelas</label><input id="className"></div><div class="field"><label>Kode Kelas</label><input id="classCode"></div><div class="field"><label>Deskripsi</label><textarea id="classDesc"></textarea></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">Batal</button> <button class="btn primary" onclick="submitClass()">Simpan</button></div></div></div>`;if(state.modal==='quiz')return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Buat Soal / Kuis</h2><div class="form-grid"><div class="field"><label>Nama</label><input id="qTitle"></div><div class="field"><label>Mata Pelajaran</label><input id="qMapel"></div><div class="field"><label>Jenis</label><select id="qType"><option>Harian</option><option>Ujian</option></select></div><div class="field"><label>Materi</label><select id="qMaterial"><option value="0">Tanpa materi</option>${data.materials.map(m=>`<option value="${m.id}">${m.title}</option>`).join('')}</select></div><div class="field"><label>Waktu</label><input id="qTime" type="number" value="20"></div><div class="field"><label>KKM</label><input id="qKkm" type="number" value="75"></div></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">Batal</button> <button class="btn primary" onclick="saveQuiz()">Simpan</button></div></div></div>`;if(state.modal==='question')return `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Tambah Soal</h2><div class="field"><label>Pertanyaan</label><textarea id="question"></textarea></div><div class="form-grid"><div class="field"><label>A</label><input id="a"></div><div class="field"><label>B</label><input id="b"></div><div class="field"><label>C</label><input id="c"></div><div class="field"><label>D</label><input id="d"></div><div class="field full"><label>Jawaban benar</label><input id="answer"></div></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">Batal</button> <button class="btn primary" onclick="saveQuestion()">Simpan Soal</button></div></div></div>`;return ''}
function closeModal(){state.modal=null;render()}
function saveQuiz(){const title=document.getElementById('qTitle').value.trim();if(!title)return alert('Nama wajib diisi.');const q={id:Date.now(),title,mapel:document.getElementById('qMapel').value.trim(),type:document.getElementById('qType').value,materialId:Number(document.getElementById('qMaterial').value),time:Number(document.getElementById('qTime').value)||20,kkm:Number(document.getElementById('qKkm').value)||75,questions:[]};data.quizzes.push(q);saveData();state.modal=null;state.quiz=q.id;state.screen='kelolaQuiz';render()}
function saveQuestion(){const q=data.quizzes.find(x=>x.id===state.quiz);if(!q)return;const text=document.getElementById('question').value.trim(),answer=document.getElementById('answer').value.trim();if(!text||!answer)return alert('Pertanyaan dan jawaban wajib diisi.');q.questions.push({text,options:[document.getElementById('a').value,document.getElementById('b').value,document.getElementById('c').value,document.getElementById('d').value],answer});saveData();state.modal=null;render()}
function render(){let html='';if(state.screen==='landing')html=landing();else if(state.screen==='login')html=login();else if(state.screen==='register')html=register();else if(state.screen==='verifyOtp')html=verifyOtp();else if(state.screen==='dashboard')html=dashboard();else if(state.screen==='kelas')html=kelas();else if(state.screen==='materi')html=materi();else if(state.screen==='detailMateri')html=detailMateri();else if(state.screen==='upload')html=upload();else if(state.screen==='aiHasil')html=aiHasil();else if(state.screen==='kuis')html=kuis();else if(state.screen==='kelolaQuiz')html=kelolaQuiz();else if(state.screen==='kerjakanKuis')html=kerjakanKuis();else if(state.screen==='hasilKuis')html=hasilKuis();else if(state.screen==='nilai')html=nilai();else if(state.screen==='statistik')html=statistik();else if(state.screen==='siswa')html=siswa();else if(state.screen==='notifikasi')html=notifikasi();else if(state.screen==='profil')html=profil();else if(state.screen==='pengaturan')html=pengaturan();document.getElementById('app').innerHTML=html+modal();window.scrollTo({top:0,behavior:'instant'})}

if ("serviceWorker" in navigator) { window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
render();
</script>
</body></html>
